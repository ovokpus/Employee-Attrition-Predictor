[project]
name = "employee-attrition"
version = "1.0.0"
description = "Predict whether an employee is likely to leave: training with MLflow tracking, served by FastAPI."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "feature-engine==1.8.2",
  "mlflow==2.19.0",
  "sqlalchemy>=2.0,<2.1",  # mlflow 2.19 is incompatible with SQLAlchemy 2.1
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attrition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
